name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            os: ubuntu-22.04
            cxx: g++-12
            build_type: Release
            shared: OFF
          - name: GCC Debug shared
            os: ubuntu-22.04
            cxx: g++-12
            build_type: Debug
            shared: ON
          - name: Clang Release
            os: ubuntu-22.04
            cxx: clang++-15
            build_type: Release
            shared: OFF
          - name: Clang ASan + UBSan
            os: ubuntu-22.04
            cxx: clang++-15
            build_type: RelWithDebInfo
            shared: OFF
            extra_cmake: -DGC_ENABLE_ASAN=ON
          - name: Clang TSan
            os: ubuntu-22.04
            cxx: clang++-15
            build_type: RelWithDebInfo
            shared: OFF
            extra_cmake: -DGC_ENABLE_TSAN=ON
          - name: macOS Release
            os: macos-latest
            build_type: Release
            shared: ON
          - name: Windows Release
            os: windows-latest
            build_type: Release
            shared: ON

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++-12 clang-15

      - name: Configure
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DGC_BUILD_BENCHMARKS=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
          ${{ matrix.extra_cmake }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test including installed package
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel 1

      - name: Repeat graph stress checks
        if: matrix.build_type == 'Release'
        run: ctest --test-dir build -C ${{ matrix.build_type }} -L stress --repeat until-fail:3 --output-on-failure

      - name: Configure library-only build
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build-library-only
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=OFF -DGC_BUILD_DEMO=OFF -DGC_BUILD_EXAMPLES=OFF -DGC_BUILD_BENCHMARKS=OFF
          ${{ matrix.extra_cmake }}

      - name: Build library-only target
        run: cmake --build build-library-only --config ${{ matrix.build_type }} --parallel
